<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EasyBoy5566 的個人網頁 - 顯示台北時間">
    <title>EasyBoy5566 | Taipei Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a1a;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f0f5;
            --text-secondary: rgba(240, 240, 245, 0.6);
            --accent-1: #6366f1;
            --accent-2: #a855f7;
            --accent-3: #ec4899;
            --glow-1: rgba(99, 102, 241, 0.3);
            --glow-2: rgba(168, 85, 247, 0.3);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        /* Animated gradient background */
        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gradient .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: float 12s ease-in-out infinite;
        }

        .bg-gradient .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: var(--accent-1);
            top: -10%;
            left: -5%;
            animation-delay: 0s;
            animation-duration: 14s;
        }

        .bg-gradient .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: var(--accent-2);
            bottom: -15%;
            right: -5%;
            animation-delay: -4s;
            animation-duration: 16s;
        }

        .bg-gradient .orb:nth-child(3) {
            width: 350px;
            height: 350px;
            background: var(--accent-3);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -8s;
            animation-duration: 18s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(30px, 40px) scale(1.02); }
        }

        /* Grain overlay */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* Main card */
        .card {
            position: relative;
            z-index: 2;
            width: 90vw;
            max-width: 560px;
            padding: 56px 48px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            backdrop-filter: blur(40px) saturate(1.4);
            -webkit-backdrop-filter: blur(40px) saturate(1.4);
            box-shadow:
                0 0 80px -20px var(--glow-1),
                0 0 120px -40px var(--glow-2),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            text-align: center;
            animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Avatar / Icon */
        .avatar {
            width: 88px;
            height: 88px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 0 40px var(--glow-1);
            animation: pulse 3s ease-in-out infinite;
            position: relative;
        }

        .avatar::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
            z-index: -1;
            opacity: 0.4;
            filter: blur(12px);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px var(--glow-1); }
            50% { transform: scale(1.04); box-shadow: 0 0 60px var(--glow-2); }
        }

        /* Label */
        .label {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.2);
            color: var(--accent-1);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        /* Name */
        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            margin-bottom: 32px;
        }

        /* Divider */
        .divider {
            width: 60px;
            height: 2px;
            margin: 0 auto 32px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            border-radius: 2px;
            opacity: 0.6;
        }

        /* Time section */
        .time-section {
            margin-bottom: 8px;
        }

        .time-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .time-label .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .time-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.2rem;
            font-weight: 600;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #f0f0f5, var(--accent-1));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            transition: opacity 0.2s;
        }

        .date-display {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Seconds bar */
        .seconds-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            margin-top: 28px;
            overflow: hidden;
        }

        .seconds-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3));
            border-radius: 3px;
            transition: width 1s linear;
        }

        /* Footer */
        .footer {
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 40px 28px;
                border-radius: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .time-display {
                font-size: 2.4rem;
            }

            .avatar {
                width: 72px;
                height: 72px;
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>
    <div class="grain"></div>

    <main class="card" id="main-card">
        <div class="avatar">E</div>
        <div class="label">Personal Page</div>
        <h1>EasyBoy5566</h1>
        <div class="divider"></div>
        <div class="time-section">
            <div class="time-label">
                <span class="dot"></span>
                台北時間 · Asia/Taipei
            </div>
            <div class="time-display" id="time">--:--:--</div>
            <div class="date-display" id="date">載入中...</div>
        </div>
        <div class="seconds-bar">
            <div class="fill" id="seconds-fill"></div>
        </div>
        <div class="footer">UTC+8 · 即時更新</div>
    </main>

    <script>
        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Taipei' };

            // Time
            const timeStr = now.toLocaleTimeString('zh-TW', {
                ...options,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            // Date
            const dateStr = now.toLocaleDateString('zh-TW', {
                ...options,
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            });

            document.getElementById('time').textContent = timeStr;
            document.getElementById('date').textContent = dateStr;

            // Seconds progress bar
            const seconds = now.toLocaleString('en-US', { ...options, second: 'numeric' });
            const ms = now.getMilliseconds();
            const progress = ((parseInt(seconds) + ms / 1000) / 60) * 100;
            document.getElementById('seconds-fill').style.width = progress + '%';
        }

        updateClock();
        setInterval(updateClock, 100);
    </script>
</body>
</html>
